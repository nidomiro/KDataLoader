name: Test lib and docs

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - "**"
    tags-ignore:
      - "v*"
jobs:
  test-application:
    name: Test the Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Clean
        run: ./gradlew clean
      - name: Test
        run: ./gradlew check
      - name: Build
        run: ./gradlew assemble

